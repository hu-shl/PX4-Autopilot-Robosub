module_name: rs_movement_control

parameters:
    - group: rs_movement_control
      definitions:
        RS_X_KP:
          description:
            short: Robosub X movement P gain
            long: Robosub PID control in X direction.
          type: float
          min: 0
          max: 1000
          default: 1


        RS_X_KI:
          description:
            short: Robosub X movement I gain
            long: Robosub PID control in X direction.
          type: float
          min: 0.0
          max: 1000.0
          default: 1.0

        RS_X_KD:
